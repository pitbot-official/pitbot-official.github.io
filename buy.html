<style>
@font-face{font-family:"Pretendard PB";src:url("/assets/pretendard.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-height:100svh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;word-break:keep-all;
  padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{margin:0;font-size:clamp(30px,4.4vw,56px);line-height:1.25;font-weight:700;letter-spacing:-.02em}
p{margin:clamp(14px,1.6vw,20px) 0 0;font-size:clamp(17px,1.5vw,21px);line-height:1.5;font-weight:600}
footer{text-align:center;font-size:13px}
.logo,h1,p{animation:rise .8s cubic-bezier(.34,1.45,.5,1) both}
h1{animation-delay:.25s}
p{animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
svg .ch,svg .dot{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}

body{background:#0A0A0B;color:#FFFFFF;font-family:"Pretendard PB","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.logo{display:flex;align-items:flex-end;gap:clamp(12px,1.4vw,18px);margin-bottom:clamp(40px,6vw,72px)}
.sym{width:clamp(44px,5vw,64px);height:auto;color:#FF6B12;transform-origin:50% 100%;
  animation:hop 2.8s cubic-bezier(.45,0,.3,1) 1.1s infinite}
.wm{width:clamp(132px,14vw,184px);height:auto;color:#FFFFFF;overflow:visible}
.wm .ch{animation:bump 2.8s ease-out infinite;animation-delay:calc(1.1s + var(--i) * .05s)}
p{color:#FF6B12}
footer{color:#5A5B61}
/* 웅크림 → 점프 → 착지 출렁 */
@keyframes hop{
  0%,48%,100%{transform:none}
  56%{transform:scale(1.1,.82)}
  68%{transform:translateY(-55%) scale(.94,1.08)}
  76%{transform:none}
  80%{transform:scale(1.08,.88)}
  86%{transform:scale(.97,1.04)}
  92%{transform:none}
}
/* 착지하는 순간 글자가 차례로 살짝 들썩 */
@keyframes bump{0%,76%,100%{transform:none}81%{transform:translateY(-12%)}88%{transform:none}}
